name: Update profile art

on:
  schedule:
    # Daily at 09:17 UTC — off the hour to dodge GitHub Actions' peak-minute queueing.
    - cron: "17 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contribution data (public HTML, no token)
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render info card SVG
        run: python scripts/make_info_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/heatmap.svg assets/info_card.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh contribution art [skip ci]"
            git push
          fi
